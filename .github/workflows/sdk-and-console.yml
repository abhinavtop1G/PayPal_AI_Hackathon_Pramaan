name: SDKs and console

on:
  push:
    paths: ["sdk/**", "frontend/**", "ml/models/biometrics/data.py", "ml/models/keystroke/data.py", "backend/security.py", ".github/workflows/sdk-and-console.yml"]
  pull_request:

jobs:
  web-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      # golden vectors from the training pipeline's own code: the SDK must match what the models were trained on
      - run: pip install numpy pandas && python sdk/spec/make_golden.py
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - working-directory: sdk/web
        run: npm ci && npm run typecheck && npm test && npm run build

  android-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.10.2" }
      - run: gradle -p sdk/android :pramaan:testDebugUnitTest :sample:assembleDebug

  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      # next typegen writes the route types (LayoutProps, PageProps) that tsc needs on a fresh checkout
      - working-directory: frontend
        run: npm ci && npm run lint && npx next typegen && npx tsc --noEmit && npm test && npm run build
